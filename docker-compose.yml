version: '3.8'

services:
  backend:
    build: .
    container_name: nestjs-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    ports:
      - '80:3000'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
