# Name of the workflow (visible in GitHub Actions tab)
name: CI

# Define when the workflow should run
on:
  # Run when code is pushed to main branch
  push:
    branches: [ "main", "development" ]

  # Run when a pull request is opened targeting main
  pull_request:
    branches: [ "main", "development" ]

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

# Jobs define what work will be done
jobs:
  build:
    # Use Ubuntu virtual machine provided by GitHub
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24   # Change if your project uses a different version

      # 3️⃣ Install dependencies
      # npm ci is preferred in CI (faster & uses package-lock.json strictly)
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Run linting (optional but recommended)
      # - name: Run linter
      #   run: npm run lint

      # 5️⃣ Run unit tests
      - name: Run tests
        run: npm run test
